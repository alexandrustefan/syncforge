name: SyncForge
options:
  bundleIdPrefix: com.syncforge
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  SyncForgeKit:
    path: SyncForgeKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.4"
    ARCHS: "$(ARCHS_STANDARD)"
targets:
  SyncForge:
    type: application
    platform: macOS
    sources:
      - path: App/SyncForge
        excludes:
          - "Support/Info.plist"
    dependencies:
      - package: SyncForgeKit
        product: SyncForgeCore
    info:
      path: App/SyncForge/Support/Info.plist
      properties:
        CFBundleDisplayName: SyncForge
        CFBundleName: SyncForge
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSHumanReadableCopyright: "Local-first audio utility. No telemetry."
        NSMicrophoneUsageDescription: "SyncForge uses the microphone during calibration and optional Live Sync to measure speaker timing. Audio is analysed in memory and never stored or sent anywhere."
        NSAudioCaptureUsageDescription: "SyncForge captures the audio your Mac plays so it can send it, in sync, to every output you select. Audio is processed locally and never stored or sent anywhere."
    entitlements:
      path: App/SyncForge/Support/SyncForge.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syncforge.SyncForge
        PRODUCT_NAME: SyncForge
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  SyncForge:
    build:
      targets:
        SyncForge: all
    run:
      config: Debug
    archive:
      config: Release
